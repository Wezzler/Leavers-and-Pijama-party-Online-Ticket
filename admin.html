<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BNB Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080808;
    color:white;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#00ff99;
}

.login-box,
.dashboard{
    background:#111;
    border:1px solid #222;
    border-radius:18px;
    padding:25px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #333;
    background:#050505;
    color:white;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin:5px;
}

.login-btn{
    width:100%;
    background:#00ff99;
    color:#000;
}

.refresh{
    background:#00ccff;
    color:#000;
}

.logout{
    background:#ff3333;
    color:white;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
    margin:25px 0;
}

.card{
    background:#181818;
    border:1px solid #292929;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.card h2{
    color:#00ff99;
    margin-top:10px;
}

.section{
    margin-top:30px;
}

.table-wrap{
    overflow-x:auto;
    margin-top:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #292929;
    text-align:left;
}

th{
    color:#00ff99;
    background:#151515;
}

.status{
    padding:5px 9px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#ffb300;
    color:#000;
}

.approved{
    background:#00cc66;
    color:#000;
}

.rejected{
    background:#ff3333;
    color:white;
}

.used{
    color:#ff5555;
    font-weight:bold;
}

.not-used{
    color:#00ff99;
    font-weight:bold;
}

.order{
    background:#181818;
    border:1px solid #292929;
    padding:18px;
    border-radius:14px;
    margin:12px 0;
}

.order button{
    background:#00ff99;
    color:#000;
}

.order .reject{
    background:#ff3333;
    color:white;
}

.hidden{
    display:none;
}

.message{
    margin-top:12px;
    text-align:center;
    color:#00ff99;
}

.danger{
    color:#ff4444;
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .login-box,
    .dashboard{
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎟️ BNB ADMIN DASHBOARD</h1>

<!-- LOGIN -->
<div id="loginBox" class="login-box">

<h2>Admin Login</h2>

<input
    type="email"
    id="email"
    placeholder="Admin Email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
>

<button class="login-btn" onclick="login()">
    🔐 LOGIN
</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">

<div style="display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;">

<h2>📊 Sales Dashboard</h2>

<div>
<button class="refresh" onclick="loadDashboard()">
🔄 Refresh
</button>

<button class="logout" onclick="logout()">
🚪 Logout
</button>
</div>

</div>


<!-- STATISTICS -->

<div class="cards">

<div class="card">
👥
<p>Total Purchases</p>
<h2 id="totalPurchases">0</h2>
</div>

<div class="card">
👦
<p>Boys Tickets</p>
<h2 id="boysTickets">0</h2>
</div>

<div class="card">
👧
<p>Girls Tickets</p>
<h2 id="girlsTickets">0</h2>
</div>

<div class="card">
💰
<p>Total Sales</p>
<h2>$<span id="totalSales">0.00</span></h2>
</div>

<div class="card">
✅
<p>Approved</p>
<h2 id="approvedCount">0</h2>
</div>

<div class="card">
⏳
<p>Pending</p>
<h2 id="pendingCount">0</h2>
</div>

</div>


<!-- PENDING PAYMENTS -->

<div class="section">

<h2>⏳ Pending Payments</h2>

<div id="pendingOrders">
Loading...
</div>

</div>


<!-- CUSTOMER RECORDS -->

<div class="section">

<h2>👥 Customer Records</h2>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>Ticket ID</th>
<th>Name</th>
<th>Phone</th>
<th>Type</th>
<th>Amount</th>
<th>EcoCash Ref</th>
<th>Purchased</th>
<th>Payment</th>
<th>Gate</th>
</tr>

</thead>

<tbody id="customerRecords">

</tbody>

</table>

</div>

</div>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://ejwsispalkidteegolea.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_1f0YOLnORGwYC_BsjN_-8g_gZot8_6t";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* ================================
   LOGIN
================================ */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if(!email || !password){

        message.textContent =
            "Enter your email and password.";

        return;
    }

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        message.textContent =
            error.message;

        return;
    }

    document.getElementById("loginBox")
        .classList.add("hidden");

    document.getElementById("dashboard")
        .classList.remove("hidden");

    loadDashboard();
}


/* ================================
   LOGOUT
================================ */

async function logout(){

    await supabaseClient.auth.signOut();

    document.getElementById("dashboard")
        .classList.add("hidden");

    document.getElementById("loginBox")
        .classList.remove("hidden");
}


/* ================================
   LOAD DASHBOARD
================================ */

async function loadDashboard(){

    await loadAllTickets();

    await loadPendingTickets();
}


/* ================================
   ALL TICKETS
================================ */

async function loadAllTickets(){

    const {
        data,
        error
    } = await supabaseClient.rpc(
        "admin_all_tickets"
    );

    if(error){

        console.error(error);

        alert(
            "Could not load customer records: " +
            error.message
        );

        return;
    }

    updateStats(data);

    const table =
        document.getElementById(
            "customerRecords"
        );

    table.innerHTML = "";

    if(!data || data.length === 0){

        table.innerHTML = `
        <tr>
            <td colspan="9">
                No customers yet.
            </td>
        </tr>
        `;

        return;
    }

    data.forEach(order => {

        const payment =
            paymentBadge(
                order.payment_status
            );

        const gate =
            order.used
            ? `<span class="used">USED</span>`
            : `<span class="not-used">NOT USED</span>`;

        table.innerHTML += `

        <tr>

            <td>
                ${escapeHtml(order.ticket_id)}
            </td>

            <td>
                ${escapeHtml(order.customer_name)}
            </td>

            <td>
                ${escapeHtml(order.phone)}
            </td>

            <td>
                ${order.ticket_type === "boys"
                    ? "👦 Boys"
                    : "👧 Girls"}
            </td>

            <td>
                $${Number(order.amount).toFixed(2)}
            </td>

            <td>
                ${escapeHtml(
                    order.ecocash_reference
                )}
            </td>

            <td>
                ${formatDate(order.created_at)}
            </td>

            <td>
                ${payment}
            </td>

            <td>
                ${gate}
            </td>

        </tr>

        `;
    });
}


/* ================================
   STATISTICS
================================ */

function updateStats(data){

    const total =
        data.length;

    const boys =
        data.filter(
            x => x.ticket_type === "boys"
        ).length;

    const girls =
        data.filter(
            x => x.ticket_type === "girls"
        ).length;

    const approved =
        data.filter(
            x => x.payment_status === "approved"
        );

    const pending =
        data.filter(
            x => x.payment_status === "pending"
        ).length;

    const sales =
        approved.reduce(
            (sum,x) =>
                sum + Number(x.amount),
            0
        );

    document.getElementById(
        "totalPurchases"
    ).textContent = total;

    document.getElementById(
        "boysTickets"
    ).textContent = boys;

    document.getElementById(
        "girlsTickets"
    ).textContent = girls;

    document.getElementById(
        "approvedCount"
    ).textContent = approved.length;

    document.getElementById(
        "pendingCount"
    ).textContent = pending;

    document.getElementById(
        "totalSales"
    ).textContent =
        sales.toFixed(2);
}


/* ================================
   PENDING PAYMENTS
================================ */

async function loadPendingTickets(){

    const {
        data,
        error
    } = await supabaseClient.rpc(
        "admin_pending_tickets"
    );

    const container =
        document.getElementById(
            "pendingOrders"
        );

    if(error){

        container.innerHTML =
            `<p class="danger">
            ${escapeHtml(error.message)}
            </p>`;

        return;
    }

    container.innerHTML = "";

    if(!data || data.length === 0){

        container.innerHTML =
            "<p>No pending payments 🎉</p>";

        return;
    }

    data.forEach(order => {

        container.innerHTML += `

        <div class="order">

            <h3>
                🎟️ ${escapeHtml(
                    order.ticket_id
                )}
            </h3>

            <p>
                <b>Name:</b>
                ${escapeHtml(
                    order.customer_name
                )}
            </p>

            <p>
                <b>Phone:</b>
                ${escapeHtml(
                    order.phone
                )}
            </p>

            <p>
                <b>Ticket:</b>
                ${order.ticket_type === "boys"
                    ? "👦 Boys"
                    : "👧 Girls"}
            </p>

            <p>
                <b>Amount:</b>
                $${Number(
                    order.amount
                ).toFixed(2)}
            </p>

            <p>
                <b>EcoCash Reference:</b>
                ${escapeHtml(
                    order.ecocash_reference
                )}
            </p>

            <p>
                <b>Purchased:</b>
                ${formatDate(
                    order.created_at
                )}
            </p>

            <br>

            <button
                onclick="setPaymentStatus(
                    '${escapeJs(order.ticket_id)}',
                    'approved'
                )">
                ✅ APPROVE
            </button>

            <button
                class="reject"
                onclick="setPaymentStatus(
                    '${escapeJs(order.ticket_id)}',
                    'rejected'
                )">
                ❌ REJECT
            </button>

        </div>

        `;
    });
}


/* ================================
   APPROVE / REJECT
================================ */

async function setPaymentStatus(
    ticketId,
    status
){

    const confirmAction =
        confirm(
            `Are you sure you want to ${status} ${ticketId}?`
        );

    if(!confirmAction)
        return;

    const {
        error
    } = await supabaseClient.rpc(
        "admin_set_payment_status",
        {
            p_ticket_id:ticketId,
            p_status:status
        }
    );

    if(error){

        alert(
            "Error: " +
            error.message
        );

        return;
    }

    alert(
        status === "approved"
        ? "Payment approved! 🎟️"
        : "Payment rejected."
    );

    loadDashboard();
}


/* ================================
   PAYMENT BADGE
================================ */

function paymentBadge(status){

    if(status === "approved"){

        return `
        <span class="status approved">
            APPROVED
        </span>
        `;
    }

    if(status === "rejected"){

        return `
        <span class="status rejected">
            REJECTED
        </span>
        `;
    }

    return `
    <span class="status pending">
        PENDING
    </span>
    `;
}


/* ================================
   DATE FORMAT
================================ */

function formatDate(date){

    if(!date)
        return "-";

    return new Date(date)
        .toLocaleString();
}


/* ================================
   SECURITY HELPERS
================================ */

function escapeHtml(value){

    if(value === null ||
       value === undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeJs(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* ================================
   CHECK EXISTING SESSION
================================ */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();

    if(data.session){

        document.getElementById(
            "loginBox"
        ).classList.add("hidden");

        document.getElementById(
            "dashboard"
        ).classList.remove("hidden");

        loadDashboard();
    }
}


/* ================================
   START
================================ */

checkSession();

</script>

</body>
  </html>
